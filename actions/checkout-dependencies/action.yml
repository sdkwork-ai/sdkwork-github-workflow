name: Checkout SDKWork dependencies
description: Checkout repositories declared by agent.workflow.json dependency plan.
inputs:
  dependencies-json:
    required: true
    description: Dependency plan JSON from scripts/agent-workflow.mjs dependencies.
  token:
    required: false
    description: GitHub token for private dependency repositories.
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        SDKWORK_RELEASE_CHECKOUT_PLAN_JSON: ${{ inputs.dependencies-json }}
        SDKWORK_RELEASE_CHECKOUT_TOKEN: ${{ inputs.token }}
      run: |
        $ErrorActionPreference = "Stop"
        $plan = $env:SDKWORK_RELEASE_CHECKOUT_PLAN_JSON | ConvertFrom-Json
        if (-not $plan.include) {
          Write-Host "[sdkwork-release-checkout] no dependencies"
          exit 0
        }
        $basic = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:SDKWORK_RELEASE_CHECKOUT_TOKEN"))
        $authHeader = "AUTHORIZATION: basic $basic"
        # A failed native command must fail the step. The default pwsh behaviour
        # only records $LASTEXITCODE, so a partially checked out dependency tree
        # would silently feed a truncated source tree into the build.
        function Assert-GitSuccess([string]$operation) {
          if ($LASTEXITCODE -ne 0) {
            throw "[sdkwork-release-checkout] $operation failed with exit code $LASTEXITCODE"
          }
        }
        foreach ($dependency in $plan.include) {
          $path = [string]$dependency.path
          $repo = [string]$dependency.repository
          $ref = [string]$dependency.ref
          $dependencyType = [string]$dependency.dependencyType
          if (-not $dependencyType) {
            $dependencyType = "runtime"
          }
          if (-not $path -or -not $repo) {
            throw "Dependency plan item is missing repository or path"
          }
          if (Test-Path -LiteralPath $path) {
            Write-Host "[sdkwork-release-checkout] skip existing $dependencyType dependency $path"
            continue
          }
          Write-Host "[sdkwork-release-checkout] checkout $dependencyType dependency $repo -> $path"
          # Windows runners do not enable long paths by default. Generated SDK
          # trees exceed MAX_PATH, and a checkout that cannot create those files
          # must not be treated as a successful dependency checkout.
          git -c "http.https://github.com/.extraheader=$authHeader" clone --no-tags --depth 1 -c core.longpaths=true "https://github.com/$repo.git" $path
          Assert-GitSuccess "clone $repo"
          git -C $path config core.longpaths true
          Assert-GitSuccess "configure core.longpaths for $repo"
          git -c "http.https://github.com/.extraheader=$authHeader" -C $path fetch --depth 1 origin $ref
          Assert-GitSuccess "fetch $ref for $repo"
          git -C $path checkout FETCH_HEAD
          Assert-GitSuccess "checkout $ref for $repo"
          if ([string]$dependency.submodules -eq "recursive") {
            git -c core.longpaths=true -C $path submodule update --init --recursive
            Assert-GitSuccess "submodule update for $repo"
          } elseif ([string]$dependency.submodules -eq "true") {
            git -c core.longpaths=true -C $path submodule update --init
            Assert-GitSuccess "submodule update for $repo"
          }
        }
