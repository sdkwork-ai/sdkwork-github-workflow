name: Publish SDKWork release assets
description: Upload selected package artifacts to a GitHub Release.
inputs:
  tag:
    required: true
    description: GitHub Release tag.
  repository:
    required: true
    description: owner/repo target.
  files:
    required: true
    description: Newline-separated file globs.
  clobber:
    required: false
    default: 'true'
    description: Whether to overwrite existing release assets.
  notes-file:
    required: false
    default: ''
    description: Markdown file used as GitHub Release notes.
runs:
  using: composite
  steps:
    - shell: pwsh
      env:
        SDKWORK_RELEASE_TAG: ${{ inputs.tag }}
        SDKWORK_RELEASE_REPOSITORY: ${{ inputs.repository }}
        SDKWORK_RELEASE_FILES: ${{ inputs.files }}
        SDKWORK_RELEASE_CLOBBER: ${{ inputs.clobber }}
        SDKWORK_RELEASE_NOTES_FILE: ${{ inputs.notes-file }}
      run: |
        $ErrorActionPreference = "Stop"
        $tag = $env:SDKWORK_RELEASE_TAG
        $repo = $env:SDKWORK_RELEASE_REPOSITORY
        $clobber = $env:SDKWORK_RELEASE_CLOBBER
        $notesFile = $env:SDKWORK_RELEASE_NOTES_FILE
        if (-not $tag) {
          throw "Release tag is required"
        }
        if (-not $repo) {
          throw "Release repository is required"
        }
        # PowerShell has no globstar: `Get-ChildItem -Path dir/**/*` matches
        # nothing, so the framework's default aggregate glob
        # (`release-assets/**/*`) would silently upload zero assets. Expand a
        # `**` glob by recursing from its literal prefix and matching the
        # remaining pattern against the workdir-relative path.
        function Resolve-ReleaseFiles([string]$glob) {
          $normalized = $glob.Replace('\', '/')
          if (-not $normalized.Contains('**')) {
            return Get-ChildItem -Path $glob -File -ErrorAction SilentlyContinue
          }
          $prefix = $normalized.Substring(0, $normalized.IndexOf('**')).TrimEnd('/')
          if (-not $prefix) { $prefix = '.' }
          $globstarToken = [string][char]1
          $regex = $normalized -replace '([.^$+{}()\[\]|\\])', '\$1'
          $regex = $regex -replace '\*\*', $globstarToken
          $regex = $regex -replace '\*', '[^/]*'
          $regex = $regex -replace '\?', '[^/]'
          $regex = $regex -replace [regex]::Escape($globstarToken), '.*'
          $regex = '^' + $regex + '$'
          $cwd = (Get-Location).Path.Replace('\', '/').TrimEnd('/')
          return Get-ChildItem -LiteralPath $prefix -File -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object {
              $full = $_.FullName.Replace('\', '/')
              $relative = if ($full.StartsWith($cwd + '/')) { $full.Substring($cwd.Length + 1) } else { $full }
              if ($relative -match $regex) { $_ }
            }
        }
        $files = @()
        $seen = @{}
        $env:SDKWORK_RELEASE_FILES -split "`n" | ForEach-Object {
          $glob = $_.Trim()
          if ($glob) {
            foreach ($file in Resolve-ReleaseFiles $glob) {
              if (-not $seen.ContainsKey($file.FullName)) {
                $seen[$file.FullName] = $true
                $files += $file
              }
            }
          }
        }
        if ($files.Count -eq 0) {
          throw "No files matched release upload inputs"
        }
        $hasNotesFile = $notesFile -and (Test-Path -LiteralPath $notesFile -PathType Leaf)
        gh release view $tag --repo $repo *> $null
        if ($LASTEXITCODE -ne 0) {
          if ($hasNotesFile) {
            gh release create $tag --repo $repo --title $tag --notes-file $notesFile
          } else {
            gh release create $tag --repo $repo --title $tag --notes "Automated SDKWork package release."
          }
        } elseif ($hasNotesFile) {
          gh release edit $tag --repo $repo --notes-file $notesFile
        }
        foreach ($file in $files) {
          $ghArgs = @("release", "upload", $tag, $file.FullName, "--repo", $repo)
          if ($clobber -eq "true") {
            $ghArgs += "--clobber"
          }
          gh @ghArgs
        }
