[workspace]
members = [
  "crates/sdkwork-api-github-workflow-assembly",
  "crates/sdkwork-api-github-workflow-standalone-gateway",
]
resolver = "2"


[workspace.package]
edition = "2021"
rust-version = "1.85"
[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"

[workspace.dependencies]
sdkwork_api_github_workflow_assembly = { path = "crates/sdkwork-api-github-workflow-assembly", package = "sdkwork-api-github-workflow-assembly" }

sdkwork_web_bootstrap = { path = "../sdkwork-web-framework/crates/sdkwork-web-bootstrap", package = "sdkwork-web-bootstrap" }


sdkwork_web_core = { path = "../sdkwork-web-framework/crates/sdkwork-web-core", package = "sdkwork-web-core" }